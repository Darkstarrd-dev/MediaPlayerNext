[package]
name = "mediaplayernext"
version = "0.1.0"
description = "MediaPlayerNext desktop host bootstrap"
edition = "2021"
default-run = "mediaplayernext"

[lib]
name = "mediaplayernext_lib"
crate-type = ["rlib"]

[[bin]]
name = "mediaplayernext"
path = "src/main.rs"

[[bin]]
name = "runtime-smoke-check"
path = "src/bin/runtime_smoke_check.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
