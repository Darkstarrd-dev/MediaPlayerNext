[package]
name = "mediaplayernext"
version = "0.1.0"
description = "MediaPlayerNext desktop host bootstrap"
edition = "2021"
license = "MIT"
default-run = "mediaplayernext"

[lib]
name = "mediaplayernext_lib"
crate-type = ["rlib"]

[[bin]]
name = "mediaplayernext"
path = "src/main.rs"

[[bin]]
name = "runtime-smoke-check"
path = "src/bin/runtime_smoke_check.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
app-core = { path = "../crates/app-core" }
media-db = { path = "../crates/media-db" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-model = { path = "../crates/shared-model" }
tauri.workspace = true
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
