name: quality-standard

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  standard:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies
        run: npm ci

      - name: quality standard
        run: npm run check:quality:standard

      - name: contracts
        run: npm run test:contracts

      - name: build web
        run: npm run build:web
